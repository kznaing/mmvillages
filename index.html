<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1976d2">
<title>Villages in Myanmar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  :root {
    --primary: #1976d2;
    --primary-dark: #1565c0;
    --success: #4caf50;
    --text: #212121;
    --text-secondary: rgba(0, 0, 0, .6);
    --divider: rgba(0, 0, 0, .12);
    --bg: #ffffff;
    --bar-h: 68px;
    --font: "Roboto", "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mmr: "Noto Sans Myanmar", "Myanmar Text", "Roboto", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
    background: #fafafa;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  .mdi { font-size: 20px; line-height: 1; }
  .mmr { font-family: var(--mmr); }

  /* ---------- app bar ---------- */
  .app-bar {
    position: fixed; top: 0; left: 0; right: 0; z-index: 30;
    height: var(--bar-h);
    display: flex; align-items: center; gap: 4px;
    padding: 0 8px;
    background: var(--primary); color: #fff;
    box-shadow: 0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12);
  }
  .app-bar .bar-title {
    flex: 1 1 auto; min-width: 0;
    font-size: 22px; font-weight: 500; letter-spacing: .0125em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-left: 4px;
  }
  .icon-btn {
    flex: 0 0 auto; width: 44px; height: 44px;
    display: grid; place-items: center;
    background: none; border: none; color: inherit; cursor: pointer;
    border-radius: 50%; font-size: 22px;
    transition: background .15s;
  }
  .icon-btn:hover { background: rgba(255,255,255,.16); }
  .icon-btn .mdi { font-size: 24px; }

  /* search field inside bar */
  .search {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: 6px;
    height: 40px; margin: 0 4px 0 2px; padding: 0 6px 0 14px;
    background: #fff; border-radius: 999px;
    box-shadow: 0 1px 3px rgba(0,0,0,.2);
  }
  .search input {
    flex: 1 1 auto; min-width: 0; border: none; outline: none;
    background: none; font: inherit; font-size: 16px; color: var(--text);
    -webkit-appearance: none; appearance: none;
  }
  .search input::placeholder { color: var(--text-secondary); }
  .search .clear {
    flex: 0 0 auto; width: 32px; height: 32px; border: none; background: none;
    color: var(--text-secondary); cursor: pointer; border-radius: 50%;
    display: grid; place-items: center;
  }
  .search .clear:hover { background: rgba(0,0,0,.06); }

  /* ---------- main ---------- */
  main {
    max-width: 640px; margin: 0 auto;
    padding-top: var(--bar-h); min-height: 100vh;
    background: var(--bg);
    box-shadow: 0 0 0 1px rgba(0,0,0,.04);
  }
  @media (min-width: 660px) {
    body { background: #eeeeee; }
    main { margin-top: 0; min-height: 100vh; }
  }

  /* ---------- list rows ---------- */
  .row {
    padding: 10px 16px; border-bottom: 1px solid var(--divider);
    cursor: pointer; background: #fff;
    transition: background .12s;
    display: block; width: 100%; text-align: left;
    font: inherit; color: inherit; border-left: none; border-right: none; border-top: none;
  }
  .row:hover { background: rgba(0,0,0,.03); }
  .row:active { background: rgba(0,0,0,.06); }
  .row .title { font-size: 17px; color: var(--text); }
  .row .sub { font-family: var(--mmr); font-size: 17px; color: var(--text-secondary); }
  .row .code { font-size: 85%; color: gray; margin-top: 2px; }

  .village-row {
    display: flex; flex-direction: row; align-items: center; gap: 8px;
  }
  .village-row .info { min-width: 0; flex: 1 1 auto; }

  /* ---------- FAB ---------- */
  .fab {
    flex: 0 0 auto; width: 40px; height: 40px; border-radius: 50%;
    border: none; cursor: pointer;
    background: var(--success); color: #fff;
    display: grid; place-items: center;
    box-shadow: 0 3px 5px -1px rgba(0,0,0,.2), 0 6px 10px 0 rgba(0,0,0,.14), 0 1px 18px 0 rgba(0,0,0,.12);
    transition: background .15s, box-shadow .15s;
  }
  .fab:hover { background: #43a047; }
  .fab .mdi { font-size: 22px; }

  /* ---------- states ---------- */
  .center-box {
    display: flex; align-items: center; justify-content: center;
    min-height: 60vh; padding: 24px; text-align: center;
    color: var(--text-secondary);
  }
  .spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 4px solid rgba(25,118,210,.2); border-top-color: var(--primary);
    animation: spin .9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty code {
    background: #f5f5f5; border: 1px solid var(--divider);
    padding: 1px 5px; border-radius: 4px; font-size: 12.5px; color: var(--text);
  }

  /* ---------- drawer ---------- */
  .overlay {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(0,0,0,.5); opacity: 0; pointer-events: none;
    transition: opacity .25s;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }
  .drawer {
    position: fixed; top: 0; bottom: 0; left: 0; z-index: 50;
    width: 256px; max-width: 80vw;
    background: #fff; box-shadow: 2px 0 8px rgba(0,0,0,.2);
    transform: translateX(-100%); transition: transform .25s;
    padding-top: 8px;
  }
  .drawer.open { transform: translateX(0); }
  .drawer .nav-item {
    display: flex; align-items: center; gap: 28px;
    padding: 14px 20px; cursor: pointer; font-size: 16px;
    color: rgba(0,0,0,.87);
  }
  .drawer .nav-item:hover { background: rgba(0,0,0,.04); }
  .drawer .nav-item .mdi { font-size: 22px; color: var(--text-secondary); }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<nav class="drawer" id="drawer" aria-label="Navigation">
  <div class="nav-item" onclick="showAbout()">
    <span class="mdi mdi-information-outline" aria-hidden="true"></span>
    <span>About</span>
  </div>
</nav>

<header class="app-bar" id="appBar"></header>
<main id="view">
  <div class="center-box"><div class="spinner" aria-label="Loading"></div></div>
</main>

<script>
const DATA = "data";
const state = { manifest: null, sr: null, township: null, filter: "" };

const $ = (id) => document.getElementById(id);

function fmt(n) { return (n || 0).toLocaleString("en-US"); }

function isIOS() {
  return /iPhone|iPad|iPod/.test(navigator.platform || "");
}

function mapLink(lng, lat, name) {
  if (lng === "" || lat === "" || lng == null || lat == null) return null;
  const lngn = Number(lng), latn = Number(lat);
  if (!isFinite(lngn) || !isFinite(latn)) return null;
  const q = `${latn},${lngn}`;
  return isIOS()
    ? `https://maps.apple.com/maps?q=${q}`
    : `https://maps.google.com/?q=${q}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignore */ }
      else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1)
    .filter((r) => r.length && !(r.length === 1 && r[0] === ""))
    .map((r) => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
      return obj;
    });
}

async function fetchCSV(path) {
  const res = await fetch(`${DATA}/${path}`);
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return csvToObjects(await res.text());
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

/* ---------- app bar ---------- */
function setAppBar(html) { $("appBar").innerHTML = html; }

function barWithMenu(title) {
  return `<button class="icon-btn" aria-label="Menu" onclick="openDrawer()"><span class="mdi mdi-menu"></span></button>
    <div class="bar-title">${esc(title)}</div>`;
}

function barWithBack(title) {
  return `<button class="icon-btn" aria-label="Back" onclick="goBack()"><span class="mdi mdi-arrow-left"></span></button>
    <div class="bar-title">${esc(title)}</div>`;
}

/* ---------- drawer ---------- */
function openDrawer() { $("drawer").classList.add("open"); $("overlay").classList.add("open"); }
function closeDrawer() { $("drawer").classList.remove("open"); $("overlay").classList.remove("open"); }

function showAbout() {
  closeDrawer();
  Swal.fire({
    title: "Villages in Myanmar",
    html: `Webapp v1.0.0<br><br>
      Data is acquired from <a href="https://themimu.info" target="_blank" rel="noopener">themimu.info</a>.<br><br>
      Developed by:<br>Kyaw Zaw Naing<br>dr.kyawzawnaing@gmail.com`,
    icon: "info",
    confirmButtonText: "Close",
    confirmButtonColor: "#1976d2"
  });
}

/* ---------- navigation ---------- */
function goBack() {
  if (state.township) goSR(state.sr, state.sr.name_eng);
  else if (state.sr) goRoot();
  else goRoot();
}

/* ---------- level 1: state / regions ---------- */
function goRoot() {
  state.sr = null; state.township = null; state.filter = "";
  window.scroll(0, 0);
  setAppBar(barWithMenu("State/Regions"));
  const view = $("view");
  const srs = state.manifest.states_regions;
  view.innerHTML = "";
  const frag = document.createDocumentFragment();
  srs.forEach((s) => {
    const b = document.createElement("div");
    b.className = "row";
    b.innerHTML = `<div class="title">${esc(s.name_eng)}</div>
      <div class="sub">${esc(s.name_mmr || "")}</div>
      <div class="code">${esc(s.pcode)}</div>`;
    b.onclick = () => goSR(s, s.name_eng);
    frag.appendChild(b);
  });
  view.appendChild(frag);
}

/* ---------- level 2: townships ---------- */
async function goSR(sr, srName) {
  state.sr = sr; state.township = null; state.filter = "";
  window.scroll(0, 0);
  setAppBar(barWithBack(srName || sr.name_eng || sr.pcode));
  const view = $("view");
  view.innerHTML = `<div class="center-box"><div class="spinner" aria-label="Loading"></div></div>`;
  let townships;
  try {
    townships = await fetchCSV(`02_townships/${sr.townships_file}`);
  } catch (e) {
    view.innerHTML = `<div class="center-box empty">Failed to load townships: ${esc(e.message)}</div>`;
    return;
  }
  townships.sort((a, b) =>
    (a["Township_Name_Eng"] || "").localeCompare(b["Township_Name_Eng"] || ""));

  view.innerHTML = "";
  const frag = document.createDocumentFragment();
  townships.forEach((r) => {
    const code = r["Tsp_Pcode"];
    const b = document.createElement("div");
    b.className = "row";
    b.innerHTML = `<div class="title">${esc(r["Township_Name_Eng"] || code)} Township</div>
      <div class="sub">${esc(r["Township_Name_MMR"] || "")}မြို့နယ်</div>
      <div class="code">${esc(code)}</div>`;
    b.onclick = () => goTownship({
      pcode: code,
      name_eng: r["Township_Name_Eng"],
      name_mmr: r["Township_Name_MMR"],
      sr_pcode: sr.pcode
    }, r["Township_Name_Eng"]);
    frag.appendChild(b);
  });
  view.appendChild(frag);
}

/* ---------- level 3: villages ---------- */
async function goTownship(township, tName) {
  state.township = township;
  window.scroll(0, 0);
  const view = $("view");

  view.innerHTML = `<div class="center-box"><div class="spinner" aria-label="Loading"></div></div>`;
  let villages;
  try {
    villages = await fetchCSV(`03_villages/${township.pcode}.csv`);
  } catch (e) {
    setAppBar(barWithBack(tName));
    view.innerHTML = `<div class="center-box empty">Failed to load villages: ${esc(e.message)}</div>`;
    return;
  }
  villages.sort((a, b) =>
    (a["Village_Name_Eng"] || "").localeCompare(b["Village_Name_Eng"] || ""));

  state.filter = "";
  renderVillageBar(tName, villages.length);

  const draw = (term) => {
    const t = (term || "").trim().toLowerCase();
    const list = villages.filter((v) =>
      !t || (v["Village_Name_Eng"] || "").toLowerCase().includes(t) ||
      (v["Village_Pcode"] || "").toLowerCase().includes(t) ||
      (v["Village_Name_MMR"] || "").includes(term.trim()));
    view.innerHTML = "";
    if (!list.length) {
      view.innerHTML = `<div class="center-box empty">No villages match.</div>`;
      return;
    }
    const frag = document.createDocumentFragment();
    list.forEach((v) => {
      const lng = v["Longitude"], lat = v["Latitude"];
      const link = mapLink(lng, lat, v["Village_Name_Eng"]);
      const row = document.createElement("div");
      row.className = "row village-row";
      row.innerHTML = `<div class="info">
          <div class="title">${esc(v["Village_Name_Eng"] || "")}</div>
          <div class="sub">${esc(v["Village_Name_MMR"] || "")}</div>
          <div class="code">Pcode : ${esc(v["Village_Pcode"] || "")}</div>
          <div class="code"> ${esc(v["Village_Tract_Name_Eng"] || "")} Village Tract </div>
          ${link ? `<div class="code"> Lat: ${esc(lat)} , Lng: ${esc(lng)} </div>` : ""}
        </div>
        ${link ? `<button class="fab" aria-label="Open map" title="Open map"><span class="mdi mdi-map-marker"></span></button>` : ""}`;
      if (link) {
        row.querySelector(".fab").onclick = (ev) => {
          ev.stopPropagation();
          window.open(link, "_blank", "noopener");
        };
      }
      frag.appendChild(row);
    });
    view.appendChild(frag);
  };

  state._draw = draw;
  draw("");
}

function renderVillageBar(tName, count) {
  setAppBar(`<button class="icon-btn" aria-label="Back" onclick="goBack()"><span class="mdi mdi-arrow-left"></span></button>
    <div class="search">
      <input type="search" id="filter" autocomplete="off" aria-label="Search villages"
        placeholder="Search ${count} villages in ${esc(tName)} Township" value="${esc(state.filter)}">
      <button class="clear" id="clearBtn" aria-label="Clear" hidden><span class="mdi mdi-close"></span></button>
    </div>`);
  const input = $("filter");
  const clearBtn = $("clearBtn");
  const sync = () => {
    state.filter = input.value;
    clearBtn.hidden = input.value === "";
    state._draw(input.value);
  };
  input.oninput = sync;
  clearBtn.onclick = () => { input.value = ""; sync(); input.focus(); };
}

/* ---------- init ---------- */
(async function init() {
  try {
    const res = await fetch(`${DATA}/manifest.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.manifest = await res.json();
  } catch (e) {
    $("view").innerHTML = `<div class="center-box empty">
      Could not load <code>data/manifest.json</code>.<br><br>
      Serve this folder over HTTP, e.g.:<br>
      <code>python3 -m http.server</code> then open
      <code>http://localhost:8000/</code>.<br><br>
      <small>${esc(e.message)}</small></div>`;
    return;
  }
  goRoot();
})();
</script>
</body>
</html>
