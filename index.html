<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f2a52">
<title>Myanmar P-Code Atlas</title>
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --panel-2: #fbfcfd;
    --border: #e5e8ee;
    --border-strong: #d3d9e2;
    --text: #1a2231;
    --muted: #68758a;
    --faint: #99a3b3;
    --ink: #0f2a52;          /* deep slate-navy */
    --accent: #245e9e;       /* muted steel blue */
    --accent-hover: #1c4c83;
    --accent-wash: #eef3f9;
    --focus: rgba(36, 94, 158, .16);

    --pad: 16px;
    --radius: 8px;
    --radius-sm: 6px;
    --header-h: 60px;
    --tap: 44px;
    --font: "Inter", "Segoe UI", "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, sans-serif;
    --font-mmr: "Noto Sans Myanmar", "Myanmar Text", sans-serif;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
    --shadow-md: 0 6px 16px -6px rgba(16, 24, 40, .16);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overscroll-behavior-y: none;
  }

  /* ---------- top bar ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
  }
  .banner {
    display: flex; align-items: center; gap: 12px;
    max-width: 1100px; margin: 0 auto;
    padding: 12px var(--pad);
  }
  .mark {
    flex: 0 0 auto; width: 34px; height: 34px; border-radius: 8px;
    background: var(--ink); color: #fff;
    display: grid; place-items: center;
    font-weight: 700; font-size: 15px; letter-spacing: .02em;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.08);
  }
  .titles { min-width: 0; }
  .titles h1 {
    margin: 0; font-size: 15px; font-weight: 650; letter-spacing: -.01em;
    color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .titles p {
    margin: 1px 0 0; font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .titles .sep { color: var(--faint); margin: 0 5px; }

  main { max-width: 1100px; margin: 0 auto; padding: var(--pad) var(--pad) 80px; }

  /* ---------- breadcrumbs ---------- */
  .crumbs {
    display: flex; flex-wrap: wrap; align-items: center; gap: 4px 2px;
    margin-bottom: 14px; font-size: 13.5px;
    position: sticky; top: var(--header-h); z-index: 15;
    background: var(--bg); padding: 10px 0 8px;
  }
  .crumbs button {
    background: none; border: none; color: var(--accent);
    cursor: pointer; padding: 3px 4px; font: inherit; font-weight: 500;
    border-radius: 4px;
  }
  .crumbs button:hover { color: var(--accent-hover); text-decoration: underline; text-underline-offset: 2px; }
  .crumbs .sep { color: var(--faint); margin: 0 2px; font-size: 12px; }
  .crumbs .here { color: var(--text); font-weight: 600; padding: 3px 4px; }

  /* ---------- toolbar ---------- */
  .toolbar {
    display: flex; flex-direction: column; gap: 10px;
    margin-bottom: 16px;
    position: sticky; top: calc(var(--header-h) + 38px); z-index: 14;
    background: var(--bg); padding: 4px 0 10px;
  }
  .search-wrap { position: relative; flex: 1 1 auto; }
  .search-wrap svg {
    position: absolute; left: 12px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 16px; color: var(--faint); pointer-events: none;
  }
  .toolbar input[type="search"] {
    width: 100%; min-height: var(--tap); padding: 11px 14px 11px 36px;
    border: 1px solid var(--border-strong); border-radius: var(--radius);
    font: inherit; font-size: 16px;
    background: var(--panel); color: var(--text);
    box-shadow: var(--shadow-sm);
    -webkit-appearance: none; appearance: none;
    transition: border-color .14s, box-shadow .14s;
  }
  .toolbar input[type="search"]::placeholder { color: var(--faint); }
  .toolbar input[type="search"]:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--focus);
  }
  .badge {
    align-self: flex-start; flex: 0 0 auto;
    color: var(--muted); font-variant-numeric: tabular-nums;
    font-size: 12.5px; font-weight: 600;
    padding: 6px 12px; border: 1px solid var(--border-strong);
    border-radius: 999px; background: var(--panel-2);
    white-space: nowrap;
  }

  /* ---------- card grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .card {
    position: relative;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px 16px 14px 18px; cursor: pointer; text-align: left;
    font: inherit; color: inherit; width: 100%;
    display: flex; flex-direction: column; gap: 2px;
    box-shadow: var(--shadow-sm);
    transition: border-color .14s, box-shadow .14s, transform .14s;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--border-strong);
    transition: background .14s;
  }
  .card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
  .card:hover::before { background: var(--accent); }
  .card:active { transform: translateY(0); box-shadow: var(--shadow-sm); }
  .card .title { font-weight: 600; font-size: 15px; color: var(--text); letter-spacing: -.005em; }
  .card .mmr { font-family: var(--font-mmr); font-size: 13px; color: var(--muted); }
  .card .meta {
    font-size: 12px; color: var(--muted); margin-top: 3px;
    display: flex; align-items: center; gap: 6px;
    font-variant-numeric: tabular-nums;
  }
  .card .meta .code { color: var(--faint); letter-spacing: .01em; }
  .card .meta .dot { width: 3px; height: 3px; border-radius: 50%; background: var(--border-strong); flex: 0 0 auto; }

  /* ---------- table: mobile stacked ---------- */
  table { width: 100%; border-collapse: collapse; }
  thead { display: none; }
  tbody tr {
    display: flex; flex-direction: column;
    position: relative;
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 14px 16px 14px 18px; margin-bottom: 8px;
    box-shadow: var(--shadow-sm);
    transition: border-color .14s, box-shadow .14s;
  }
  tbody tr::before {
    content: ""; position: absolute; left: 0; top: 12px; bottom: 12px;
    width: 3px; border-radius: 0 3px 3px 0; background: var(--border-strong);
  }
  tbody tr:hover { border-color: var(--accent); box-shadow: var(--shadow-md); }
  tbody tr:hover::before { background: var(--accent); }
  tbody td { display: block; padding: 0; border: none; font-size: 14px; text-align: left; }
  td[data-label="P-Code"] { display: none; }
  td[data-label="Name (Eng)"] {
    order: 1; font-weight: 600; font-size: 15.5px; color: var(--text); letter-spacing: -.005em;
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 7px;
  }
  td[data-label="Name (Eng)"] .pcode {
    font-weight: 500; font-size: 11.5px; color: var(--muted);
    background: var(--accent-wash); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 5px; letter-spacing: .02em;
    font-variant-numeric: tabular-nums;
  }
  td[data-label="Name (MMR)"] { order: 2; color: var(--muted); margin-top: 3px; font-size: 13.5px; }
  td[data-label="Village Tract"] {
    order: 3; color: var(--muted); font-size: 12.5px; margin-top: 7px;
    display: flex; align-items: center; gap: 6px;
  }
  td[data-label="Village Tract"]::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: var(--faint); flex: 0 0 auto;
  }
  td[data-label="Longitude"], td[data-label="Latitude"] { display: none; }
  td[data-label="Map"] { order: 4; margin-top: 11px; }

  .num { font-variant-numeric: tabular-nums; color: var(--muted); }
  a.map {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--accent); text-decoration: none; font-weight: 600; font-size: 13px;
    padding: 7px 13px; border: 1px solid var(--border-strong); border-radius: var(--radius-sm);
    background: var(--panel-2); white-space: nowrap;
    transition: background .14s, border-color .14s, color .14s;
  }
  a.map svg { width: 14px; height: 14px; }
  a.map:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
  .dash { color: var(--faint); }
  .mmr { font-family: var(--font-mmr); }

  .empty, .status {
    padding: 32px 20px; text-align: center; color: var(--muted);
    background: var(--panel); border: 1px solid var(--border-strong);
    border-radius: var(--radius); box-shadow: var(--shadow-sm); font-size: 14px;
  }
  .empty code { background: var(--panel-2); border: 1px solid var(--border); padding: 1px 5px; border-radius: 4px; font-size: 12.5px; color: var(--text); }
  .status { color: var(--muted); }

  /* ---------- tablet / desktop ---------- */
  @media (min-width: 560px) {
    :root { --pad: 24px; }
    .banner { padding: 14px var(--pad); }
    .titles h1 { font-size: 16px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
    .toolbar { flex-direction: row; align-items: center; gap: 12px; }
    .badge { align-self: center; }
  }

  @media (min-width: 720px) {
    thead { display: table-header-group; }
    table {
      border: 1px solid var(--border-strong); border-radius: var(--radius);
      overflow: hidden; background: var(--panel); box-shadow: var(--shadow-sm);
    }
    tbody tr {
      display: table-row; position: static;
      border: none; border-radius: 0; padding: 0; margin: 0; box-shadow: none;
    }
    tbody tr::before { content: none; }
    tbody tr:hover { box-shadow: none; }
    tbody td { display: table-cell; padding: 10px 14px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
    tbody td[data-label="P-Code"] { display: table-cell; }
    tbody td[data-label="Longitude"], tbody td[data-label="Latitude"] { display: table-cell; }
    tbody td[data-label="Name (Eng)"] { display: table-cell; font-size: 13.5px; font-weight: 500; }
    tbody td[data-label="Name (Eng)"] .pcode { display: none; }
    tbody td[data-label="Name (MMR)"] { margin: 0; font-size: 13.5px; }
    tbody td[data-label="Village Tract"] { display: table-cell; margin: 0; flex-wrap: initial; }
    tbody td[data-label="Village Tract"]::before { content: none; }
    tbody td[data-label="Map"] { margin: 0; }
    a.map { border: none; background: none; padding: 2px 0; }
    a.map:hover { background: none; color: var(--accent-hover); text-decoration: underline; text-underline-offset: 2px; }
    th {
      background: var(--panel-2); color: var(--muted);
      font-weight: 600; font-size: 11.5px; letter-spacing: .05em; text-transform: uppercase;
      text-align: left; padding: 11px 14px;
      border-bottom: 1px solid var(--border-strong);
    }
    tbody tr:nth-child(even) td { background: var(--panel-2); }
    tbody tr:hover td { background: var(--accent-wash); }
    tbody tr:last-child td { border-bottom: none; }
  }
</style>
</head>
<body>
<header>
  <div class="banner">
    <div class="mark" aria-hidden="true">MM</div>
    <div class="titles">
      <h1>Myanmar P-Code Atlas</h1>
      <p>MIMU Place Codes <span class="sep">·</span> Release 9.7 (Jan 2026) <span class="sep">·</span> States/Regions → Townships → Villages</p>
    </div>
  </div>
</header>
<main>
  <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
  <div class="toolbar" id="toolbar" hidden>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input type="search" id="filter" placeholder="Filter by name or P-code…" autocomplete="off" aria-label="Filter">
    </div>
    <span class="badge" id="countBadge"></span>
  </div>
  <div id="view" class="grid"><div class="status">Loading manifest…</div></div>
</main>

<script>
const DATA = "data";
const state = { manifest: null, sr: null, township: null, filter: "" };

const $ = (id) => document.getElementById(id);

function fmt(n) { return n.toLocaleString("en-US"); }

function mapLink(lng, lat, name) {
  if (lng === "" || lat === "" || lng == null || lat == null) return null;
  const lngn = Number(lng), latn = Number(lat);
  if (!isFinite(lngn) || !isFinite(latn)) return null;
  const q = `${latn},${lngn}`;
  const label = encodeURIComponent(name || q);
  return `https://www.google.com/maps/search/?api=1&query=${q}`;
}

function parseCSV(text) {
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuotes) {
      if (c === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += c;
    } else {
      if (c === '"') inQuotes = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { /* ignore */ }
      else field += c;
    }
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function csvToObjects(text) {
  const rows = parseCSV(text);
  if (!rows.length) return [];
  const headers = rows[0];
  return rows.slice(1)
    .filter((r) => r.length && !(r.length === 1 && r[0] === ""))
    .map((r) => {
      const obj = {};
      headers.forEach((h, i) => { obj[h] = r[i] !== undefined ? r[i] : ""; });
      return obj;
    });
}

async function fetchCSV(path) {
  const res = await fetch(`${DATA}/${path}`);
  if (!res.ok) throw new Error(`${path}: HTTP ${res.status}`);
  return csvToObjects(await res.text());
}

function renderCrumbs() {
  const c = $("crumbs");
  c.innerHTML = "";
  const mk = (label, handler, here) => {
    if (here) {
      const s = document.createElement("span");
      s.className = "here"; s.textContent = label; c.appendChild(s);
      return;
    }
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = handler;
    c.appendChild(b);
  };
  mk("States / Regions", goRoot, !state.sr);
  if (state.sr) {
    c.appendChild(sep());
    const srName = state.sr.name_eng || state.sr.pcode;
    mk(srName, () => goSR(state.sr, srName), !state.township);
  }
  if (state.township) {
    c.appendChild(sep());
    const tName = state.township.name_eng || state.township.pcode;
    mk(tName, () => goTownship(state.township, tName), true);
  }
}
function sep() { const s = document.createElement("span"); s.className = "sep"; s.textContent = "›"; return s; }

function setToolbar(show, placeholder) {
  const tb = $("toolbar");
  tb.hidden = !show;
  if (show) {
    $("filter").placeholder = placeholder || "Filter by name or P-code…";
  }
}

async function goRoot() {
  state.sr = null; state.township = null; state.filter = "";
  renderCrumbs();
  const view = $("view");
  view.className = "grid";
  const srs = state.manifest.states_regions;
  setToolbar(true, "Filter states / regions…");
  $("countBadge").textContent = `${srs.length} states / regions`;
  $("filter").value = "";

  const draw = (term) => {
    const t = term.trim().toLowerCase();
    const list = srs.filter((s) =>
      !t || s.name_eng.toLowerCase().includes(t) || s.pcode.toLowerCase().includes(t) || (s.name_mmr || "").includes(term.trim()));
    view.innerHTML = "";
    if (!list.length) { view.innerHTML = `<div class="empty">No matches.</div>`; return; }
    list.forEach((s) => {
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = `<span class="title">${esc(s.name_eng)}</span>
        <span class="mmr">${esc(s.name_mmr || "")}</span>
        <span class="meta"><span class="code">${esc(s.pcode)}</span><span class="dot"></span>${fmt(s.township_count)} townships</span>`;
      b.onclick = () => goSR(s, s.name_eng);
      view.appendChild(b);
    });
  };
  $("filter").oninput = (e) => draw(e.target.value);
  draw("");
}

async function goSR(sr, srName) {
  state.sr = sr; state.township = null; state.filter = "";
  renderCrumbs();
  const view = $("view");
  view.className = "grid";
  setToolbar(true, "Filter townships…");
  $("filter").value = "";
  view.innerHTML = `<div class="status">Loading townships…</div>`;
  let townships;
  try {
    townships = await fetchCSV(`02_townships/${sr.townships_file}`);
  } catch (e) {
    view.innerHTML = `<div class="empty">Failed to load townships: ${esc(e.message)}</div>`;
    return;
  }
  const countByCode = Object.fromEntries(state.manifest.townships.map((t) => [t.pcode, t.village_count]));
  $("countBadge").textContent = `${townships.length} townships`;

  const draw = (term) => {
    const t = term.trim().toLowerCase();
    const list = townships.filter((r) =>
      !t || (r["Township_Name_Eng"] || "").toLowerCase().includes(t) ||
      (r["Tsp_Pcode"] || "").toLowerCase().includes(t) || (r["Township_Name_MMR"] || "").includes(term.trim()));
    view.innerHTML = "";
    if (!list.length) { view.innerHTML = `<div class="empty">No townships match.</div>`; return; }
    list.forEach((r) => {
      const code = r["Tsp_Pcode"];
      const b = document.createElement("button");
      b.className = "card";
      b.innerHTML = `<span class="title">${esc(r["Township_Name_Eng"] || code)}</span>
        <span class="mmr">${esc(r["Township_Name_MMR"] || "")}</span>
        <span class="meta"><span class="code">${esc(code)}</span><span class="dot"></span>${fmt(countByCode[code] || 0)} villages</span>`;
      b.onclick = () => goTownship({ pcode: code, name_eng: r["Township_Name_Eng"], name_mmr: r["Township_Name_MMR"], sr_pcode: sr.pcode }, r["Township_Name_Eng"]);
      view.appendChild(b);
    });
  };
  $("filter").oninput = (e) => draw(e.target.value);
  draw("");
}

async function goTownship(township, tName) {
  state.township = township;
  renderCrumbs();
  const view = $("view");
  view.className = "";
  setToolbar(true, "Filter villages by name (Eng/MMR) or P-code…");
  $("filter").value = "";
  view.innerHTML = `<div class="status">Loading villages…</div>`;
  let villages;
  try {
    villages = await fetchCSV(`03_villages/${township.pcode}.csv`);
  } catch (e) {
    view.innerHTML = `<div class="empty">Failed to load villages: ${esc(e.message)}</div>`;
    return;
  }
  if (!villages.length) {
    $("countBadge").textContent = "0 villages";
    view.innerHTML = `<div class="empty">No villages recorded for this township.</div>`;
    $("filter").oninput = null;
    return;
  }
  const cols = state.manifest.village_columns;
  const withCoords = villages.filter((v) => mapLink(v["Longitude"], v["Latitude"], v["Village_Name_Eng"])).length;
  $("countBadge").textContent = `${fmt(villages.length)} villages · ${fmt(withCoords)} mapped`;

  const draw = (term) => {
    const t = term.trim().toLowerCase();
    const list = villages.filter((v) =>
      !t || (v["Village_Name_Eng"] || "").toLowerCase().includes(t) ||
      (v["Village_Pcode"] || "").toLowerCase().includes(t) ||
      (v["VT_Pcode"] || "").toLowerCase().includes(t) ||
      (v["Village_Name_MMR"] || "").includes(term.trim()));
    view.innerHTML = "";
    if (!list.length) { view.innerHTML = `<div class="empty">No villages match.</div>`; return; }
    const table = document.createElement("table");
    table.innerHTML = `<thead><tr>
      <th>Village P-Code</th><th>Name (Eng)</th><th>Name (MMR)</th>
      <th>Village Tract</th><th>Longitude</th><th>Latitude</th><th>Map</th>
    </tr></thead><tbody></tbody>`;
    const tbody = table.querySelector("tbody");
    const frag = document.createDocumentFragment();
    list.forEach((v) => {
      const lng = v["Longitude"], lat = v["Latitude"];
      const link = mapLink(lng, lat, v["Village_Name_Eng"]);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="num" data-label="P-Code">${esc(v["Village_Pcode"] || "")}</td>
        <td data-label="Name (Eng)">${esc(v["Village_Name_Eng"] || "")} <span class="pcode">(${esc(v["Village_Pcode"] || "")})</span></td>
        <td class="mmr" data-label="Name (MMR)">${esc(v["Village_Name_MMR"] || "")}</td>
        <td data-label="Village Tract">${esc(v["Village_Tract_Name_Eng"] || "")}${v["Village_Tract_Name_Eng"] ? " Village Tract" : ""}</td>
        <td class="num" data-label="Longitude">${esc(lng || "")}</td>
        <td class="num" data-label="Latitude">${esc(lat || "")}</td>
        <td data-label="Map">${link ? `<a class="map" href="${link}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>Map</a>` : `<span class="dash">—</span>`}</td>`;
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    view.appendChild(table);
  };
  $("filter").oninput = (e) => draw(e.target.value);
  draw("");
}

function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

(async function init() {
  try {
    const res = await fetch(`${DATA}/manifest.json`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.manifest = await res.json();
  } catch (e) {
    $("view").innerHTML = `<div class="empty">
      Could not load <code>data/manifest.json</code>.<br><br>
      Serve this folder over HTTP, e.g.:<br>
      <code>python3 -m http.server</code> then open
      <code>http://localhost:8000/</code>.<br><br>
      <small>${esc(e.message)}</small></div>`;
    return;
  }
  goRoot();
})();
</script>
</body>
</html>
